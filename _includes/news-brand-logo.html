{% if include.logo %}
  <span class="site-news__publication-meta site-news__publication-meta--media" aria-label="{{ include.name | escape }} logo">
    <img class="site-news__journal-logo{% if include.wide %} site-news__journal-logo--wide{% endif %}" src="{{ include.logo | relative_url }}" alt="{{ include.name | escape }} logo" loading="lazy" decoding="async">
  </span>
{% endif %}
