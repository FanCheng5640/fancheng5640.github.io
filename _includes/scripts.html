<script>
  document.addEventListener("click", function(event) {
    var button = event.target.closest("[data-copy-email]");
    if (!button) {
      return;
    }
    event.preventDefault();
    event.stopPropagation();

    var email = button.getAttribute("data-copy-email");
    var status = button.parentElement.querySelector(".author__email-copy-status");
    var setStatus = function(message) {
      if (!status) {
        return;
      }
      status.textContent = message;
      window.clearTimeout(status._copyTimer);
      status._copyTimer = window.setTimeout(function() {
        status.textContent = "";
      }, 1800);
    };
    var fallbackCopy = function() {
      var input = document.createElement("textarea");
      input.value = email;
      input.setAttribute("readonly", "");
      input.style.position = "fixed";
      input.style.left = "-9999px";
      document.body.appendChild(input);
      input.select();
      var copied = document.execCommand("copy");
      document.body.removeChild(input);
      if (!copied) {
        throw new Error("copy command failed");
      }
    };

    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(email).then(function() {
        setStatus("Copied");
      }).catch(function() {
        try {
          fallbackCopy();
          setStatus("Copied");
        } catch (error) {
          setStatus("Copy failed");
        }
      });
      return;
    }

    try {
      fallbackCopy();
      setStatus("Copied");
    } catch (error) {
      setStatus("Copy failed");
    }
  }, true);
</script>

<script>
  (function() {
    var links = document.querySelectorAll("#main a[href]");
    links.forEach(function(link) {
      if (link.closest(".masthead") || link.closest("#theme-toggle")) {
        return;
      }
      if (link.matches("[data-publication-figure-open], [data-publication-video-open]")) {
        return;
      }

      var href = link.getAttribute("href");
      if (!href || href === "#" || href.indexOf("javascript:") === 0 || href.charAt(0) === "#") {
        return;
      }

      var url;
      try {
        url = new URL(href, window.location.href);
      } catch (error) {
        return;
      }

      if ((url.protocol !== "http:" && url.protocol !== "https:") || url.origin === window.location.origin) {
        return;
      }

      link.setAttribute("target", "_blank");
      var rel = (link.getAttribute("rel") || "").split(/\s+/).filter(Boolean);
      if (rel.indexOf("noopener") === -1) {
        rel.push("noopener");
      }
      link.setAttribute("rel", rel.join(" "));
    });
  })();
</script>
