name: Sync scholarly data

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. These two entries map to 07:30 in Israel
    # summer/winter time; the local-time gate below skips the non-matching one.
    - cron: "30 4 * * *"
    - cron: "30 5 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check Israel local notification window
        id: local_time_gate
        env:
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          schedule = os.environ.get("GITHUB_EVENT_SCHEDULE", "")
          should_run = True

          if event_name == "schedule":
              minute, hour, *_ = schedule.split()
              scheduled_utc = datetime.now(timezone.utc).replace(
                  hour=int(hour),
                  minute=int(minute),
                  second=0,
                  microsecond=0,
              )
              scheduled_local = scheduled_utc.astimezone(ZoneInfo("Asia/Jerusalem"))
              should_run = scheduled_local.hour == 7 and scheduled_local.minute == 30
              print(f"Scheduled UTC: {scheduled_utc.isoformat()}")
              print(f"Scheduled Israel local time: {scheduled_local.isoformat()}")
              print(f"Run this schedule: {should_run}")
          else:
              print(f"Manual event {event_name}; running immediately.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"should_run={'true' if should_run else 'false'}\n")
          PY

      - uses: actions/checkout@v4
        if: steps.local_time_gate.outputs.should_run == 'true'

      - name: Set up Python
        if: steps.local_time_gate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Snapshot scholarly data before sync
        if: steps.local_time_gate.outputs.should_run == 'true'
        run: python .github/scripts/scholarly_sync_report.py snapshot --output "$RUNNER_TEMP/scholarly-before.json"

      - name: Sync publications from ORCID
        if: steps.local_time_gate.outputs.should_run == 'true'
        run: python .github/scripts/sync_orcid_publications.py

      - name: Sync Google Scholar citation metrics
        if: steps.local_time_gate.outputs.should_run == 'true'
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          GOOGLE_SCHOLAR_STATUS_OUTPUT: ${{ runner.temp }}/google-scholar-status.json
          GOOGLE_SCHOLAR_WRITE_STALE_ON_FAILURE: "0"
        run: python .github/scripts/sync_google_scholar.py

      - name: Validate Journal Impact Factor freshness
        if: steps.local_time_gate.outputs.should_run == 'true'
        run: python scripts/check_journal_metrics_freshness.py

      - name: Generate scholarly update report
        if: steps.local_time_gate.outputs.should_run == 'true'
        id: report
        run: >
          python .github/scripts/scholarly_sync_report.py report
          --before "$RUNNER_TEMP/scholarly-before.json"
          --output "$RUNNER_TEMP/scholarly-report.md"
          --json-output "$RUNNER_TEMP/scholarly-report.json"
          --scholar-status "$RUNNER_TEMP/google-scholar-status.json"
          --append-summary

      - name: Commit updated scholarly data
        if: steps.local_time_gate.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data _publications files/papers _pages/about.md
          if git diff --cached --quiet; then
            echo "No scholarly data updates."
          else
            git commit -m "Sync scholarly data"
            git push
          fi

      - name: Email scholarly update report
        if: steps.local_time_gate.outputs.should_run == 'true' && steps.report.outputs.has_changes == 'true'
        env:
          REPORT_EMAIL_TO: ${{ secrets.SCHOLARLY_REPORT_EMAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY }}
        run: >
          python .github/scripts/scholarly_sync_report.py email
          --report "$RUNNER_TEMP/scholarly-report.md"
          --report-json "$RUNNER_TEMP/scholarly-report.json"
          --to "$REPORT_EMAIL_TO"
          --only-if-changed

      - name: Require fresh Google Scholar metrics
        if: steps.local_time_gate.outputs.should_run == 'true' && steps.report.outputs.google_scholar_sync_alert == 'true'
        run: |
          echo "Google Scholar citation metrics were not refreshed. Public cached metrics were left unchanged."
          echo "Configure SERPAPI_API_KEY for stable scheduled Google Scholar updates, or check the report above for the direct-fetch error."
          exit 1
