name: Sync scholarly data

on:
  workflow_dispatch:
  schedule:
    # Three recovery attempts finish before the workday. The final 09:05
    # attempt is also the only scheduled run allowed to send a failure email.
    # Off-round minutes reduce exposure to GitHub's busiest schedule times.
    - cron: "15 6 * * *"
      timezone: "Asia/Jerusalem"
    - cron: "45 6 * * *"
      timezone: "Asia/Jerusalem"
    - cron: "15 7 * * *"
      timezone: "Asia/Jerusalem"
    - cron: "5 9 * * *"
      timezone: "Asia/Jerusalem"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Decide whether this attempt is needed
        id: retry_policy
        env:
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: python .github/scripts/scholarly_retry_policy.py

      - name: Set up Python
        if: steps.retry_policy.outputs.should_sync == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Snapshot scholarly data before sync
        if: steps.retry_policy.outputs.should_sync == 'true'
        run: python .github/scripts/scholarly_sync_report.py snapshot --output "$RUNNER_TEMP/scholarly-before.json"

      - name: Sync publications from ORCID
        if: steps.retry_policy.outputs.should_sync == 'true'
        run: python .github/scripts/sync_orcid_publications.py

      - name: Sync Google Scholar citation metrics
        if: steps.retry_policy.outputs.should_sync == 'true'
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          GOOGLE_SCHOLAR_STATUS_OUTPUT: ${{ runner.temp }}/google-scholar-status.json
          GOOGLE_SCHOLAR_WRITE_STALE_ON_FAILURE: "0"
          GOOGLE_SCHOLAR_FETCH_RETRIES: "6"
          GOOGLE_SCHOLAR_RETRY_DELAY_SECONDS: "10"
        run: python .github/scripts/sync_google_scholar.py

      - name: Validate Journal Impact Factor freshness
        if: steps.retry_policy.outputs.should_sync == 'true'
        run: python scripts/check_journal_metrics_freshness.py

      - name: Generate scholarly update report
        if: steps.retry_policy.outputs.should_sync == 'true'
        id: report
        run: >
          python .github/scripts/scholarly_sync_report.py report
          --before "$RUNNER_TEMP/scholarly-before.json"
          --output "$RUNNER_TEMP/scholarly-report.md"
          --json-output "$RUNNER_TEMP/scholarly-report.json"
          --scholar-status "$RUNNER_TEMP/google-scholar-status.json"
          --append-summary

      - name: Commit updated scholarly data
        if: steps.retry_policy.outputs.should_sync == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data _publications files/papers _pages/about.md
          if git diff --cached --quiet; then
            echo "No scholarly data updates."
          else
            git commit -m "Sync scholarly data"
            git push
          fi

      - name: Email scholarly update report
        if: >-
          steps.retry_policy.outputs.should_sync == 'true' &&
          steps.report.outputs.has_changes == 'true' &&
          (github.event_name == 'workflow_dispatch' ||
          steps.retry_policy.outputs.final_attempt == 'true')
        env:
          REPORT_EMAIL_TO: ${{ secrets.SCHOLARLY_REPORT_EMAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY }}
        run: >
          python .github/scripts/scholarly_sync_report.py email
          --report "$RUNNER_TEMP/scholarly-report.md"
          --report-json "$RUNNER_TEMP/scholarly-report.json"
          --to "$REPORT_EMAIL_TO"
          --only-if-changed

      - name: Require fresh Google Scholar metrics
        if: >-
          steps.retry_policy.outputs.should_sync == 'true' &&
          steps.report.outputs.google_scholar_sync_alert == 'true' &&
          steps.retry_policy.outputs.final_attempt == 'true'
        run: |
          echo "Google Scholar citation metrics were not refreshed after all four daily cloud attempts."
          echo "Public cached metrics were left unchanged."
          echo "Configure SERPAPI_API_KEY for stable scheduled Google Scholar updates, or check the report above for the direct-fetch error."
          exit 1
